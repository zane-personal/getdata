<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page (Get Data)</title>
    <style>
              /* Import Google Font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        /* Reset basic styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* Login Card Style */
        .login-card {
            width: 100%;
            max-width: 380px;
            background-color: #ffffff;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #f1f5f9;
        }

        /* Title Style */
        .login-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            color: #1e293b;
            letter-spacing: 0.1em;
            margin-bottom: 32px;
        }

        /* Form and Input Layout */
        .form-group {
            margin-bottom: 16px;
        }

        .input-field {
            width: 100%;
            padding: 14px 20px;
            background-color: #eaeaea;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            color: #333333;
            outline: none;
            transition: all 0.2s ease;
        }

        /* Input Placeholder Color */
        .input-field::placeholder {
            color: #9ca3af;
        }

        /* Input Focus Style */
        .input-field:focus {
            box-shadow: 0 0 0 2px #8583f7;
            background-color: #f3f4f6;
        }

        /* Remember me and Forgot Password Layout */
        .options-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            margin-bottom: 24px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #8583f7;
            border-radius: 4px;
            cursor: pointer;
        }

        .options-text {
            font-size: 13px;
            color: #9ca3af;
            font-weight: 400;
            text-decoration: none;
        }

        .forgot-link {
            font-size: 13px;
            color: #8583f7;
            text-decoration: none;
            font-weight: 400;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Login Button Style */
        .login-btn {
            width: 100%;
            padding: 16px;
            background-color: #8583f7;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(133, 131, 247, 0.2);
            transition: all 0.2s ease;
        }

        .login-btn:hover {
            background-color: #7371e3;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        /* Custom Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background-color: #ffffff;
            border-radius: 12px;
            width: 100%;
            max-width: 320px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .modal-msg {
            font-size: 14px;
            color: #4b5563;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .modal-close-btn {
            width: 100%;
            padding: 10px;
            background-color: #8583f7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .modal-close-btn:hover {
            background-color: #7371e3;
        }
    </style>
</head>
<body>

    <!-- Login Card Container -->
    <div class="login-card">
        
        <!-- Title -->
        <h1 class="login-title">LOGIN</h1>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
                <script>

    </script>
            <!-- Username Input -->
            <div class="form-group">
                <input 
                    type="text" 
                    id="username"
                    placeholder="Username" 
                    required
                    class="input-field"
                >
            </div>

            <!-- Password Input -->
            <div class="form-group">
                <input 
                    type="password" 
                    id="password"
                    placeholder="Password" 
                    required
                    class="input-field"
                >
            </div>

            <!-- Remember me and Forgot Password Links -->
            <div class="options-container">
                <!-- Remember me Checkbox -->
                <label class="remember-me">
                    <input type="checkbox">
                    <span class="options-text">Remember me</span>
                </label>
                
                <!-- Forgot Password Link -->
                <a href="#" onclick="showModal('Password Recovery', 'This feature will be available soon.')" class="forgot-link">
                    Forgot?
                </a>
            </div>

            <!-- Login Button -->
            <button type="submit" class="login-btn">
                LOGIN
            </button>
        </form>

    </div>

    <!-- Custom Modal Notification for Testing -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle" class="modal-title"></h3>
            <p id="modalMessage" class="modal-msg"></p>
            <button onclick="closeModal()" class="modal-close-btn">
                Close
            </button>
        </div>
    </div>

    <!-- JavaScript Logic -->


<script>
        // Function to handle form submission
        function handleLogin(event) {
            event.preventDefault(); // Prevent page reload
            
            const username = document.getElementById('username').value;
            
            // Show success notification
            showModal(
                'Login Successful', 
                `Hello, ${username}! You have successfully logged in.`
            );
        }

        // Function to show the custom modal
        function showModal(title, message) {
            const modal = document.getElementById('customModal');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            
            modal.classList.add('active');
        }

        // Function to close the custom modal
        function closeModal() {
            const modal = document.getElementById('customModal');
            modal.classList.remove('active');
        }
</script>
</body>
</html>
