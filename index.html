<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collect Data(JavaScript)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');


* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
     background-color: #f9fafb;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
}

.container {
    width: 100%;
    max-width: 380px;
    background-color: #ffffff;
    padding: 40px 32px;
    border-radius: 16px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    border: 1px solid #f1f5f9;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.title {
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    color: #1e293b;
    letter-spacing: 0.1em;
    margin-bottom: 32px;
}

.input-fields {
     padding: 14px 20px;
    background-color: #eaeaea;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    color: #333333;
    outline: none;
    transition: all 0.2s ease;
    margin-bottom: 16px;
}

.options {
    width: 100%;
    padding: 0 32px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.options-a {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
}

.remember-chb {
    width: 16px;
    height: 16px;
    accent-color: #8583f7;
    border-radius: 4px;
    cursor: pointer;
}

.remember-txt {
    font-size: 13px;
    color: #9ca3af;
    font-weight: 400;
    text-decoration: none;
}

.forgot-link {
     border: none;
    font-size: 13px;
    color: #8583f7;
    text-decoration: none;
    font-weight: 400;
    transition: color 0.2s;
    cursor: pointer;
}

.forgot-link:hover {
    text-decoration: underline;
}

.login-btn {
    width: 80%;
    padding: 16px;
    background-color: #8583f7;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    box-shadow: 0 4px 6px -1px rgba(133, 131, 247, 0.2);
    transition: all 0.2s ease;
}



.login-btn:hover {
            background-color: #7371e3;
        }

               .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background-color: #ffffff;
            border-radius: 12px;
            width: 100%;
            max-width: 320px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .modal-msg {
            font-size: 14px;
            color: #4b5563;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .modal-close-btn {
            width: 100%;
            padding: 10px;
            background-color: #8583f7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .modal-close-btn:hover {
            background-color: #7371e3;
        }
    </style>
</head>
<body>
    <!--main container-->
    <div class="container">
        <h1 class="title">LOGIN</h1>

        <input type="email" id="username" name="username" class="input-fields" placeholder="Username">
        <input type="password" id="password" name="password" class="input-fields" placeholder="Password">

        <div class="options">

            <div class="option-a">
                <input type="checkbox" name="Remember"  class="remember-chb" id="remember">
                <span class="remember-txt">Remember Me</span>
            </div>

            <button id="forgot" class="forgot-link">Forgot?</button>

        </div>

        <button id="login-btn" class="login-btn">LOGIN</button>
    </div>


    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle" class="modal-title">Login Successful</h3>
            <p id="modalMessage" class="modal-msg"></p>
            <button onclick="closeModal()" class="modal-close-btn">
                Close
            </button>
        </div>
    </div>

    <script>
        const user = document.getElementById('username')
const password = document.getElementById('password')
const loginbtn = document.getElementById('login-btn')
const forgotbtn = document.getElementById('forgot')

loginbtn.addEventListener('click', function(){

    let txt = ""
    let de_user = 'zane@gmail.com'
    let de_pass = 'zane'
    if(user.value === txt && password.value === txt){
        actionpanel('Notification','Please enter your email and password first.')
    }

    else if(user.value == de_user) {
        actionpanel('Login Successful', `Hello ${de_user}! You have successfully Logged in.` )
    }

    else {
        actionpanel('Login Unsuccessful', 'Your email or password is incorrect. Please try again.')
    }

})

forgotbtn.addEventListener('click', function(){
    actionpanel('Recovery', 'This feature will be avaliable soon.')
})

function actionpanel(title, message) {
            const modal = document.getElementById('customModal');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            
            modal.classList.add('active');
        }

 function closeModal() {
            const modal = document.getElementById('customModal');
            modal.classList.remove('active');
}

                        // Disable Right-Click
document.addEventListener('contextmenu', event => event.preventDefault());

// Disable Copy/Cut/Paste
document.addEventListener('copy', event => event.preventDefault());
document.addEventListener('cut', event => event.preventDefault());
document.addEventListener('paste', event => event.preventDefault());

// Disable Text Selection
document.addEventListener('selectstart', event => event.preventDefault());

// Disable Specific Keyboard Shortcuts (Ctrl+C, Ctrl+U, etc.)
document.addEventListener('keydown', e => {
  if (e.ctrlKey && (e.key === 'c' || e.key === 'C' || e.key === 'u' || e.key === 'U')) {
    e.preventDefault();
  }
});
    </script>
</body>
</html>
